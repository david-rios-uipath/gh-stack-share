<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitHub Stack Share options</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        min-width: 260px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2328;
      }
      label:first-of-type { margin-top: 0 }
      label {
        display: flex;
        margin-top: 12px;
        gap: 8px;
        align-items: baseline;
      }
      p {
        margin: 4px 0 0 24px;
        color: #59636e;
        font-size: 12px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0d1117; color: #f0f6fc; }
        p { color: #9198a1; }
      }
    </style>
  </head>
  <body>
    <label><input type="checkbox" id="include-trunk" /> Include the trunk branch</label>
    <p>Check to prefix the summary with the trunk row.</p>

    <label><input type="checkbox" id="show-pr-numbers" /> Show pull request numbers</label>
    <p>Check to append each pull request number to its line.</p>
    <script src="options.js"></script>
  </body>
</html>
